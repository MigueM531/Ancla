<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- Símbolo de Ancla estilizada con toque moderno e ingenieril -->
  <g transform="translate(4, 4)">
    <!-- Aro superior -->
    <circle cx="20" cy="8" r="5" stroke="#DC2626" stroke-width="2.5" fill="none" />
    <circle cx="20" cy="8" r="2" fill="#DC2626" />
    <!-- Barra transversal -->
    <path d="M11 16H29" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Vástago vertical -->
    <path d="M20 13V33" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Arco inferior del ancla -->
    <path d="M7 23C7 32 13 36 20 36C27 36 33 32 33 23" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" />
    <!-- Puntas / uñas del ancla -->
    <path d="M5 21L7 24L10 22" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35 21L33 24L30 22" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Texto de la marca ANCLA -->
  <text x="52" y="27" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">
    ANCLA
  </text>
  <text x="53" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.8" fill="#DC2626">
    MONITOREO &amp; RETENCIÓN
  </text>
</svg>

