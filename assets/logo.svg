<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5b"/>
      <stop offset="100%" stop-color="#b81424"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring Badge -->
  <circle cx="50" cy="50" r="46" fill="#16181f" stroke="#2a2e39" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#redGradient)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Anchor Geometry -->
  <!-- Top Ring -->
  <circle cx="50" cy="22" r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="50" cy="22" r="3" fill="url(#redGradient)"/>

  <!-- Crossbar -->
  <line x1="32" y1="36" x2="68" y2="36" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="2.5" fill="url(#redGradient)"/>
  <circle cx="68" cy="36" r="2.5" fill="url(#redGradient)"/>

  <!-- Central Stem -->
  <line x1="50" y1="28" x2="50" y2="76" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Anchor Flukes / Arc -->
  <path d="M 24 54 C 24 78, 76 78, 76 54" fill="none" stroke="url(#redGradient)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Arrows at tips -->
  <path d="M 19 55 L 24 45 L 29 55 Z" fill="#ffffff"/>
  <path d="M 71 55 L 76 45 L 81 55 Z" fill="#ffffff"/>

  <!-- Bottom Tip Accent -->
  <path d="M 46 76 L 50 82 L 54 76 Z" fill="url(#redGradient)"/>
</svg>

